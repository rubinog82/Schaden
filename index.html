function customerIdFor(p) {
  if (p.customerId) return p.customerId;
  const example = seed.find(x => x.id === p.id) || seed.find(x =>
    x.customer === p.customer && x.address === p.address && x.city === p.city);
  return example ? example.customerId : 'customer-' +
    [p.customer, p.address, p.city].map(x => String(x || '').trim().toLowerCase()).join('|');
}

const EXPANSION_KEY = KEY + '_customer_projects_20261119';
function loadProjects() {
  let stored = null, expanded = false;
  try {
    stored = JSON.parse(localStorage.getItem(KEY));
    expanded = localStorage.getItem(EXPANSION_KEY) === '1';
  } catch (_) {}
  const hasStored = Array.isArray(stored) && stored.length > 0;
  const result = normalizeProjects(hasStored ? stored : seed);
  if (hasStored && !expanded) {
    const existing = new Set(result.map(p => p.id));
    additionalProjects.forEach(example => {
      const parent = result.find(p => p.id === example.demoParentId);
      if (!existing.has(example.id) && parent) {
        const added = normalizeProjects([example])[0];
        // Die Kundendaten der vorhandenen Version übernehmen; Schadenwerte bleiben unabhängig.
        for (const key of ['customerId', 'customerNumber', 'customer', 'contact', 'address', 'city']) {
          added[key] = parent[key];
        }
        result.push(added);
        existing.add(added.id);
      }
    });
  }
  if (!expanded) {
    try {
      localStorage.setItem(KEY, JSON.stringify(result));
      localStorage.setItem(EXPANSION_KEY, '1');
    } catch (_) {}
  }
  return result;
}
